on:
  push:
    branches: [main]

name: Render and publish site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R packages used in slides
        run: install.packages(c("rmarkdown", "knitr", "tidyverse", "fixest", "ggplot2", "modelsummary", "MatchIt", "sf"))
        shell: Rscript {0}
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
